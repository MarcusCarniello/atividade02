{% extends "base.html" %}

{% block title %}Cadastro | Vetor Imóveis{% endblock %}

{% block content %}
<main>
    <section class="contact-section">
        <div class="section-heading">
            <h2>Cadastro de Clientes</h2>
            <p>Preencha os dados para se cadastrar.</p>
        </div>

        <form class="contact-form" method="post" action="{{ url_for('cadastro') }}">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(12) 90000-0000" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@email.com" required>
            </div>

            <button type="submit" class="form-submit">Cadastrar</button>
        </form>
    </section>
</main>
{% endblock %}
